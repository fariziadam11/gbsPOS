# GitLab CI/CD Pipeline for GBS POS-CMS API

stages:
  - lint
  - test
  - security
  - build
  - deploy-staging
  - deploy-production

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  POS_IMAGE: $CI_REGISTRY_IMAGE/gbs-pos-api
  CMS_IMAGE: $CI_REGISTRY_IMAGE/gbs-cms-api
  POSTGRES_DB: gbs_pos_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

# ==================== TEMPLATES ====================
.go-cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/

.docker-login:
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

# ==================== LINT STAGE ====================
lint:pos-api:
  stage: lint
  image: golangci/golangci-lint:latest
  extends: .go-cache
  script:
    - cd gbs-pos-api
    - golangci-lint run --timeout=5m
  only:
    - merge_requests
    - main
    - develop

lint:cms-api:
  stage: lint
  image: golangci/golangci-lint:latest
  extends: .go-cache
  script:
    - cd gbs-cms-api
    - golangci-lint run --timeout=5m
  only:
    - merge_requests
    - main
    - develop

# ==================== TEST STAGE ====================
test:pos-api:
  stage: test
  image: golang:1.26-alpine
  extends: .go-cache
  services:
    - postgres:15-alpine
  variables:
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/gbs_pos_test?sslmode=disable
    JWT_SECRET: test-secret-key-minimum-32-characters-long
  before_script:
    - apk add --no-cache git gcc musl-dev
    - cd gbs-pos-api
    - go mod download
  script:
    - go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: gbs-pos-api/coverage.out
  only:
    - merge_requests
    - main
    - develop

test:cms-api:
  stage: test
  image: golang:1.26-alpine
  extends: .go-cache
  services:
    - postgres:15-alpine
  variables:
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/gbs_pos_test?sslmode=disable
    JWT_SECRET: test-secret-key-minimum-32-characters-long
  before_script:
    - apk add --no-cache git gcc musl-dev
    - cd gbs-cms-api
    - go mod download
  script:
    - go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: gbs-cms-api/coverage.out
  only:
    - merge_requests
    - main
    - develop

# ==================== SECURITY STAGE ====================
security:trivy-scan:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 0 --no-progress --format json -o trivy-report.json .
    - trivy fs --exit-code 1 --severity CRITICAL --no-progress .
  artifacts:
    reports:
      container_scanning: trivy-report.json
  only:
    - merge_requests
    - main
    - develop

security:gosec:
  stage: security
  image: securego/gosec:latest
  script:
    - gosec -fmt json -out gosec-report.json ./gbs-pos-api/... || true
    - gosec -fmt json -out gosec-cms-report.json ./gbs-cms-api/... || true
  artifacts:
    reports:
      sast: gosec-report.json
  only:
    - merge_requests
    - main
    - develop

# ==================== BUILD STAGE ====================
build:pos-api:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  extends: .docker-login
  script:
    - docker build -f gbs-pos-api/Dockerfile -t $POS_IMAGE:$CI_COMMIT_SHA -t $POS_IMAGE:latest .
    - docker push $POS_IMAGE:$CI_COMMIT_SHA
    - docker push $POS_IMAGE:latest
  only:
    - main
    - develop

build:cms-api:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  extends: .docker-login
  script:
    - docker build -f gbs-cms-api/Dockerfile -t $CMS_IMAGE:$CI_COMMIT_SHA -t $CMS_IMAGE:latest .
    - docker push $CMS_IMAGE:$CI_COMMIT_SHA
    - docker push $CMS_IMAGE:latest
  only:
    - main
    - develop

# ==================== DEPLOY STAGING ====================
deploy:staging:
  stage: deploy-staging
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $STAGING_USER@$STAGING_HOST << 'EOF'
        cd /opt/gbs-pos-cms-api
        git pull origin develop
        docker-compose pull
        docker-compose up -d --force-recreate
        docker system prune -af
      EOF
    - sleep 10
    - wget --spider --tries=3 https://staging-api.gbs-pos.com/health
  environment:
    name: staging
    url: https://staging-api.gbs-pos.com
  only:
    - develop

# ==================== DEPLOY PRODUCTION ====================
deploy:production:
  stage: deploy-production
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PRODUCTION_HOST >> ~/.ssh/known_hosts
  script:
    # Backup database
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_HOST << 'EOF'
        docker exec gbs-pos-cms-api-postgres-1 pg_dump -U postgres gbs_pos > /backup/gbs_pos_$(date +%Y%m%d_%H%M%S).sql
      EOF
    # Deploy
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_HOST << 'EOF'
        cd /opt/gbs-pos-cms-api
        git pull origin main
        docker-compose pull
        docker-compose up -d --force-recreate
        docker system prune -af
      EOF
    - sleep 15
    - wget --spider --tries=3 https://api.gbs-pos.com/health
  environment:
    name: production
    url: https://api.gbs-pos.com
  when: manual
  only:
    - main

# ==================== ROLLBACK ====================
rollback:production:
  stage: deploy-production
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PRODUCTION_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_HOST << 'EOF'
        cd /opt/gbs-pos-cms-api
        git reset --hard HEAD~1
        docker-compose up -d --force-recreate
      EOF
    - sleep 15
    - wget --spider --tries=3 https://api.gbs-pos.com/health
  environment:
    name: production
    url: https://api.gbs-pos.com
  when: manual
  only:
    - main
